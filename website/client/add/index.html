<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musicwish</title>
    <link rel="stylesheet" type="text/css" href="/index.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Creepster&display=swap"
        rel="stylesheet"
    />
</head>
<body>
    <hero>
        <hero-left>
        <h1>Gib ein Lied ein</h1>

        </hero-left>
        <hero-right>
        <form id="form_song">
            <input name="song" type="text" placeholder="Don't stop be...">
            <input type="submit" value="Hinzufügen">
        </form>
        </hero-right>
    </hero>
    <script>

    const params = new URL(window.location.href).searchParams

    const event = params.get("event")
    document.getElementById("form_song").addEventListener("submit", function(e){
      e.preventDefault()
      const form = new FormData(this)
      window.location.href = "/client/add/detail/?songid=" + form.get("song") + "&event=" +event
    })
    </script>
    <footer>
        <p>&copy; MUSICWISH BY LENNARD HAUFE</p>
        <p>Version v1.0.0</p>
        <a href="https://haufe-server.de/en/imprint_privacy"
            >Impressum und Privatspähre</a
        >
    </footer>
</body>
</html>
