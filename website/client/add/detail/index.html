<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musicwish</title>
        <link rel="stylesheet" type="text/css" href="/index.css">
        <link
            href="https://fonts.googleapis.com/css2?family=Creepster&display=swap"
            rel="stylesheet"
        />
</head>
<body>
    <hero>
        <hero-left>
            <h1>Dein Gesuchtes Lied</h1>
        </hero-left>

        <hero-right>
            <button onclick="senddata()">Hinzufügen</button>
        </hero-right>

    </hero>
    <script>

    const params = new URL(window.location.href).searchParams

    const event = params.get("event")
    const song = params.get("songid")
    document.getElementById("veranstaltung_song").innerHTML = song
    document.getElementById("veranstaltung_id").innerHTML = event
    function senddata(){
      fetch("/api/client/add_song?song_id=" + song + "&event_name=" + event, {
        method: "POST",
      }).then((res) => {
        console.log(res.status)
        if(res.status == 202 || res.status == 200){
          window.location.href = "/client/well"
        }
        else{
          window.location.href = "/client/bad"
        }
      })
    }
    </script>
    <footer>
        <p>&copy; MUSICWISH BY LENNARD HAUFE</p>
        <p>Version v1.0.0</p>
        <a href="https://haufe-server.de/en/imprint_privacy"
            >Impressum und Privatspähre</a
        >
    </footer>
</body>
</html>
