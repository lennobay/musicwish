<body>
    <hero>
        <hero-left>
            <h1>Danke! Dein Lied wurde notiert</h1>
        </hero-left>

        <hero-right style="display: flex; flex-direction: column; gap: 1rem;">
            <i style="font-family: sans-serif; color: hsl(0 0% 90%);">Du kannst das Fenster schliessen oder zu den Optionen zurück kommen </i>
            <button onclick="backtooptions()">Zurück</button>
        </hero-right>

    </hero>
    <script>

    const params = new URL(window.location.href).searchParams

    const event = params.get("event")
    const song = params.get("songid")
    document.getElementById("veranstaltung_id").innerHTML = event
    function backtooptions(){
      window.location.href ="/client?event=" + event
    }
    </script>
